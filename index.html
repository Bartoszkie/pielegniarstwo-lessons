<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plan Zajęć - Pielęgniarstwo</title>
    <meta name="description" content="Plan zajęć dla studentów pielęgniarstwa" />
    <meta name="theme-color" content="#F5F5F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash of the wrong colours
      (function () {
        try {
          var pref = localStorage.getItem('theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (pref === 'light' || pref === 'dark') {
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute('content', dark ? '#0C0A09' : '#F5F5F4');
            });
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA / iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Plan Zajęć" />
    <link rel="apple-touch-icon" href="/pielegniarstwo-lessons/apple-touch-icon-180x180.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/pielegniarstwo-lessons/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
